name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      # No database is needed: every route is server-rendered on demand, so nothing
      # queries Postgres during `next build`. Prisma does need a resolvable URL to
      # generate its client, which `npm ci` does via the postinstall hook.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/clubrecruit_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
